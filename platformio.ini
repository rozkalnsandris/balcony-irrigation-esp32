[platformio]
default_envs = esp32_ci

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/git_rev_macro.py

lib_deps =
    knolleary/PubSubClient @ 2.8.0

[env:esp32_ci]
extends = esp32_base
; Build-only environment. No OTA target and no production credentials required.

[env:esp32_esp_mqtt_probe]
extends = esp32_base
; Source-only #28 probe. Prove both public header/API access and that the
; precompiled Arduino-only framework can resolve core ESP-MQTT symbols.
build_flags =
    -D ESP_MQTT_COMPILE_PROBE=1
    -Wl,-u,esp_mqtt_client_init
    -Wl,-u,esp_mqtt_client_start

[env:esp32_check]
extends = esp32_base
; Phase 4 bounded static analysis: project code only, medium/high visible,
; while CI fails only on high-severity defects. The pinned PlatformIO Core
; resolves the compatible Cppcheck tool for its check integration.
check_tool = cppcheck
check_skip_packages = yes
check_severity = medium, high

[env:esp32_ota]
extends = esp32_base
upload_protocol = espota
upload_port = balkons-esp32.local
; Set the OTA authentication flag only for an intentional upload, e.g.
; PLATFORMIO_UPLOAD_FLAGS='--auth=...' pio run -e esp32_ota -t upload

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++17
