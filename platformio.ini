[platformio]
default_envs = esp32_ci

[env]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient @ 2.8.0

[env:esp32_ci]
; Build-only environment. No OTA target and no production credentials required.

[env:esp32_ota]
upload_protocol = espota
upload_port = balkons-esp32.local
; Set the OTA authentication flag only for an intentional upload, e.g.
; PLATFORMIO_UPLOAD_FLAGS='--auth=...' pio run -e esp32_ota -t upload
