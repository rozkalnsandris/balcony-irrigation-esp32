[platformio]
default_envs = esp32_ci

[esp32_base]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
extra_scripts = pre:scripts/git_rev_macro.py

lib_deps =
    knolleary/PubSubClient @ 2.8.0

[env:esp32_ci]
extends = esp32_base
; Build-only environment. No OTA target and no production credentials required.

[env:esp32_mqtt_runtime_adapter]
extends = esp32_base
; #31 source-only adapter boundary. The real firmware remains on PubSubClient
; in this phase; this environment compiles the pinned espMqttClient adapter.
lib_deps =
    knolleary/PubSubClient @ 2.8.0
    bertmelis/espMqttClient @ 1.7.3
build_flags =
    -D MQTT_RUNTIME_ADAPTER_BUILD=1
    -D EMC_ALLOW_NOT_CONNECTED_PUBLISH=0
    -D EMC_RX_BUFFER_SIZE=1024
    -D EMC_TX_BUFFER_SIZE=1024

[env:esp32_mqtt_runtime_candidate]
extends = esp32_base
; C3 ephemeral generated-runtime proof. This environment intentionally omits
; PubSubClient so the rendered candidate cannot compile through the legacy MQTT
; dependency by accident.
lib_deps =
    bertmelis/espMqttClient @ 1.7.3
build_flags =
    -D MQTT_RUNTIME_ADAPTER_BUILD=1
    -D EMC_ALLOW_NOT_CONNECTED_PUBLISH=0
    -D EMC_RX_BUFFER_SIZE=1024
    -D EMC_TX_BUFFER_SIZE=1024

[env:esp32_mqtt_runtime_candidate_check]
extends = env:esp32_mqtt_runtime_candidate
; C3 bounded static analysis of the ephemeral rendered candidate.
check_tool = cppcheck
check_skip_packages = yes
check_severity = medium, high

[env:esp32_check]
extends = esp32_base
; Phase 4 bounded static analysis: project code only, medium/high visible,
; while CI fails only on high-severity defects. The pinned PlatformIO Core
; resolves the compatible Cppcheck tool for its check integration.
check_tool = cppcheck
check_skip_packages = yes
check_severity = medium, high

[env:esp32_ota]
extends = esp32_base
upload_protocol = espota
upload_port = balkons-esp32.local
; Set the OTA authentication flag only for an intentional upload, e.g.
; PLATFORMIO_UPLOAD_FLAGS='--auth=...' pio run -e esp32_ota -t upload

[env:native]
platform = native
test_framework = unity
test_build_src = no
build_flags = -std=c++17
