name: branch-phase1-patcher

on:
  push:
    branches:
      - firmware/urgent-stop-priority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply exact Phase 1 source patch
        run: python scripts/apply_phase1_patch.py

      - name: Remove temporary patch machinery
        run: |
          rm scripts/apply_phase1_patch.py
          rm .github/workflows/branch-phase1-patcher.yml

      - name: Commit resulting source tree
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'firmware: prioritize urgent pump stop'
          git push origin HEAD:firmware/urgent-stop-priority
