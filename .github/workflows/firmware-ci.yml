name: firmware-ci

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  classify:
    name: FAST-LANE classify
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docs_only: ${{ steps.scope.outputs.docs_only }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify changed files
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os
          import pathlib
          import subprocess

          if os.environ['EVENT_NAME'] != 'pull_request':
              docs_only = False
          else:
              base = os.environ['BASE_SHA']
              head = os.environ['HEAD_SHA']
              if not base or not head:
                  raise SystemExit('missing pull request base/head SHA')
              changed = subprocess.check_output(
                  ['git', 'diff', '--name-only', '--diff-filter=ACMRD', base, head],
                  text=True,
              ).splitlines()
              if not changed:
                  raise SystemExit('empty pull request diff')
              docs_only = all(
                  pathlib.PurePosixPath(path).suffix.lower() in {'.md', '.txt'}
                  or path.startswith('docs/')
                  for path in changed
              )
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              output.write(f"docs_only={'true' if docs_only else 'false'}\n")
          print(f'FAST_LANE_DOCS_ONLY={str(docs_only).lower()}')
          PY

  repository-safety:
    name: repository safety
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check repository safety
        run: python scripts/repo_safety_check.py

  build:
    needs: [classify, repository-safety]
    if: needs.classify.outputs.docs_only != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      PYTHONDONTWRITEBYTECODE: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check 'platformio==6.1.19'

      - name: Run native command-safety tests
        run: pio test -e native

      - name: Run deterministic renderer tests on real checkout
        run: python scripts/test_render_mqtt_runtime_candidate.py

      - name: Create non-secret CI configuration
        run: cp include/secrets.example.h include/secrets.h

      - name: Build espMqttClient runtime adapter boundary
        run: pio run -e esp32_mqtt_runtime_adapter

      - name: Install candidate-only MQTT dependencies
        run: pio pkg install -e esp32_mqtt_runtime_candidate

      - name: Verify pinned espMqttClient source contract
        run: |
          python scripts/check_espmqttclient_contract.py \
            --libdeps-root .pio/libdeps/esp32_mqtt_runtime_candidate
          test ! -d .pio/libdeps/esp32_mqtt_runtime_candidate/PubSubClient

      - name: Render and build ephemeral espMqttClient candidate
        shell: bash
        run: |
          set -euo pipefail

          original="${RUNNER_TEMP}/main.cpp.original"
          candidate_a="${RUNNER_TEMP}/mqtt-runtime-candidate-a.cpp"
          candidate_b="${RUNNER_TEMP}/mqtt-runtime-candidate-b.cpp"

          cp src/main.cpp "${original}"

          restore_main() {
            cp "${original}" src/main.cpp
          }
          trap restore_main EXIT

          python scripts/render_mqtt_runtime_candidate.py \
            src/main.cpp --output "${candidate_a}"
          python scripts/render_mqtt_runtime_candidate.py \
            src/main.cpp --output "${candidate_b}"

          cmp -s "${candidate_a}" "${candidate_b}"
          sha256sum "${candidate_a}" "${candidate_b}"

          cp "${candidate_a}" src/main.cpp
          test "$(git diff --name-only)" = "src/main.cpp"
          ! grep -F '<PubSubClient.h>' src/main.cpp
          ! grep -F 'PubSubClient mqtt' src/main.cpp

          pio run -e esp32_mqtt_runtime_candidate
          pio check -e esp32_mqtt_runtime_candidate_check --fail-on-defect=high

          restore_main
          trap - EXIT

          cmp -s src/main.cpp "${original}"
          git diff --exit-code
          test -z "$(git status --porcelain)"

      - name: Build ESP32 CI firmware
        run: pio run -e esp32_ci

      - name: Run bounded Cppcheck analysis
        run: pio check -e esp32_check --fail-on-defect=high

      - name: Build ESP32 OTA firmware (build only)
        run: pio run -e esp32_ota

      - name: Verify repository restored and clean
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"

  fast-lane-merge-gate:
    name: FAST-LANE Merge Gate
    needs: [classify, repository-safety, build]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify required validation results
        env:
          CLASSIFY_RESULT: ${{ needs.classify.result }}
          SAFETY_RESULT: ${{ needs.repository-safety.result }}
          DOCS_ONLY: ${{ needs.classify.outputs.docs_only }}
          BUILD_RESULT: ${{ needs.build.result }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$CLASSIFY_RESULT" == success ]]
          [[ "$SAFETY_RESULT" == success ]]
          if [[ "$DOCS_ONLY" == true ]]; then
            [[ "$BUILD_RESULT" == skipped ]]
          else
            [[ "$BUILD_RESULT" == success ]]
          fi
          echo "FAST_LANE_MERGE_GATE=PASS"
