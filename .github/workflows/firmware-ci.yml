name: firmware-ci

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.13'

      - name: Check repository safety
        run: python scripts/repo_safety_check.py

      - name: Install PlatformIO
        run: python -m pip install --disable-pip-version-check 'platformio==6.1.19'

      - name: Run native command-safety tests
        run: pio test -e native

      - name: Create non-secret CI configuration
        run: cp include/secrets.example.h include/secrets.h

      - name: Build espMqttClient runtime adapter boundary
        run: pio run -e esp32_mqtt_runtime_adapter

      - name: Build ESP32 CI firmware
        run: pio run -e esp32_ci

      - name: Run bounded Cppcheck analysis
        run: pio check -e esp32_check --fail-on-defect=high

      - name: Build ESP32 OTA firmware (build only)
        run: pio run -e esp32_ota
