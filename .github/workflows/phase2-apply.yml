name: phase2-apply

on:
  push:
    branches:
      - firmware/bounded-mqtt-reconnect

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Apply bounded Phase 2 patch
        run: python scripts/phase2_apply.py

      - name: Validate scoped diff
        run: git diff --check -- src/main.cpp

      - name: Commit scoped firmware change
        run: |
          if git diff --quiet -- src/main.cpp; then
            echo "No source change required."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/main.cpp
          git commit -m "firmware: bound MQTT reconnect latency"
          git push origin HEAD:firmware/bounded-mqtt-reconnect
