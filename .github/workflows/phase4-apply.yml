name: phase4-apply

on:
  pull_request:
    types:
      - opened
      - reopened

permissions:
  contents: write

jobs:
  apply:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'firmware/phase4-pure-timing-static-analysis'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out exact PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: true

      - name: Apply guarded main.cpp patch
        run: python tools/phase4_patch.py

      - name: Verify patch shape
        run: |
          git diff --check
          git diff -- src/main.cpp

      - name: Commit patched firmware source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/main.cpp
          if git diff --cached --quiet; then
            echo 'No src/main.cpp patch produced' >&2
            exit 1
          fi
          git commit -m 'firmware: integrate pump timing policy'
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
