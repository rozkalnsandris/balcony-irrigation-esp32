name: phase3-branch-patcher

on:
  push:
    branches:
      - firmware/runtime-memory-telemetry

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - name: Check out Phase 3 branch
        uses: actions/checkout@v4
        with:
          ref: firmware/runtime-memory-telemetry
          fetch-depth: 0

      - name: Apply guarded Phase 3 patch
        run: python3 tools/phase3_patch.py

      - name: Remove temporary branch patcher
        run: |
          rm tools/phase3_patch.py
          rm .github/workflows/phase3-branch-patcher.yml

      - name: Verify final scoped diff
        run: |
          git diff -- src/main.cpp
          test ! -e tools/phase3_patch.py
          test ! -e .github/workflows/phase3-branch-patcher.yml
          git status --short

      - name: Commit Phase 3 firmware integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "firmware: add runtime memory telemetry"
          git push origin HEAD:firmware/runtime-memory-telemetry
